<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unit Converter — TOOLBOX</title>

  <!-- Main website CSS -->
  <link rel="stylesheet" href="../../style.css">

  <!-- Unit Converter CSS -->
  <link rel="stylesheet" href="unit.css">

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
</head>

<body>

  <div class="background" aria-hidden="true">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <div class="grid-bg"></div>
  </div>

  <header class="navbar">
    <a href="../../index.html" class="logo">
      <i class="fa-solid fa-toolbox"></i>
      TOOL<span>BOX</span>
    </a>

    <a href="../../index.html" class="nav-cta">
      <i class="fa-solid fa-arrow-left"></i>
      Back to Home
    </a>
  </header>

  <main class="converter-page">

    <section class="converter-card">

      <div class="converter-header">
        <div class="tool-symbol">
          <i class="fa-solid fa-arrows-left-right"></i>
        </div>

        <h1>Unit Converter</h1>

        <p>
          Convert length, weight, temperature, time and more.
        </p>
      </div>

      <div class="converter-form">

        <div class="form-group full-width">
          <label for="category">Conversion Type</label>

          <select id="category">
            <option value="length">Length</option>
            <option value="weight">Weight</option>
            <option value="temperature">Temperature</option>
            <option value="time">Time</option>
            <option value="area">Area</option>
            <option value="volume">Volume</option>
            <option value="speed">Speed</option>
            <option value="data">Data</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="amount">Enter Value</label>

          <input
            type="number"
            id="amount"
            value="1"
            placeholder="Enter value"
          >
        </div>

        <div class="form-group">
          <label for="fromUnit">From</label>
          <select id="fromUnit"></select>
        </div>

        <button
          class="swap-btn"
          id="swapBtn"
          type="button"
          aria-label="Swap units"
        >
          <i class="fa-solid fa-arrow-right-arrow-left"></i>
        </button>

        <div class="form-group">
          <label for="toUnit">To</label>
          <select id="toUnit"></select>
        </div>

      </div>

      <div class="result-box">
        <span>Converted Result</span>
        <strong id="result">Loading...</strong>
      </div>

      <a href="../../index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i>
        Back to TOOLBOX
      </a>

    </section>

  </main>
<footer>
 <div class="footer-copy">

            © <span id="year"></span> TOOLBOX.
            Made with
            <i class="fa-solid fa-heart"></i>
            by Gorav.

        </div>

</footer>
   
  <script src="unit.js"></script>

</body>
</html>
