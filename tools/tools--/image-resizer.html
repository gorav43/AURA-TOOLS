<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Resizer | TOOLBOX</title>

  <!-- Main Website CSS -->
  <link rel="stylesheet" href="../../style.css">

  <!-- Image Resizer CSS -->
  <link rel="stylesheet" href="image-resizer.css">

  <!-- Font Awesome Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
</head>

<body>

  <!-- Navbar -->
  <header class="header">
    <nav class="navbar">
      <a href="../../index.html" class="logo">
        TOOL<span>BOX</span>
      </a>

      <ul class="nav-links">
        <li><a href="../../index.html">Home</a></li>
        <li><a href="../../index.html">Tools</a></li>
        <li><a href="../../about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main>

    <section class="resizer-container">

      <h1>
        <i class="fa-solid fa-expand"></i>
        Image Resizer
      </h1>

      <p class="resizer-description">
        Resize your images quickly and easily without uploading them anywhere.
      </p>

      <!-- Upload Box -->
      <div class="resizer-upload-box" id="resizerUploadBox">

        <i class="fa-solid fa-cloud-arrow-up"></i>

        <h3>Choose an Image</h3>

        <p>
          Click here to upload JPG, PNG, WEBP or other image files
        </p>

        <input
          type="file"
          id="resizerInput"
          accept="image/*"
        >

      </div>

      <!-- Image Preview -->
      <div class="resizer-preview" id="resizerPreview">

        <img
          id="resizerPreviewImage"
          src=""
          alt="Selected image preview"
        >

        <p
          class="resizer-file-name"
          id="resizerFileName"
        ></p>

      </div>

      <!-- Resize Controls -->
      <div class="resizer-controls" id="resizerControls">

        <div class="resizer-field">
          <label for="resizerWidth">Width in pixels</label>

          <input
            type="number"
            id="resizerWidth"
            min="1"
            placeholder="Enter width"
          >
        </div>

        <div class="resizer-field">
          <label for="resizerHeight">Height in pixels</label>

          <input
            type="number"
            id="resizerHeight"
            min="1"
            placeholder="Enter height"
          >
        </div>

        <div class="resizer-field">
          <label for="resizerFormat">Output Format</label>

          <select id="resizerFormat">
            <option value="jpeg">JPG</option>
            <option value="png">PNG</option>
            <option value="webp">WEBP</option>
          </select>
        </div>

        <div class="resizer-field">
          <label for="resizerQuality">Image Quality</label>

          <input
            type="number"
            id="resizerQuality"
            min="10"
            max="100"
            value="90"
          >
        </div>

      </div>

      <!-- Aspect Ratio Checkbox -->
      <label class="resizer-checkbox">
        <input
          type="checkbox"
          id="resizerLockRatio"
          checked
        >

        Maintain aspect ratio
      </label>

      <!-- Buttons -->
      <div class="resizer-actions" id="resizerActions">

        <button
          type="button"
          class="resizer-btn primary"
          id="resizeBtn"
        >
          <i class="fa-solid fa-expand"></i>
          Resize Image
        </button>

        <button
          type="button"
          class="resizer-btn secondary"
          id="resetResizerBtn"
        >
          <i class="fa-solid fa-rotate-left"></i>
          Reset
        </button>

      </div>

      <!-- Result -->
      <div class="resizer-result" id="resizerResult">

        <h3>
          <i class="fa-solid fa-check-circle"></i>
          Image Resized Successfully
        </h3>

        <img
          id="resizerResultImage"
          src=""
          alt="Resized image preview"
        >

        <p
          class="resizer-info"
          id="resizerResultInfo"
        ></p>

        <a
          href="#"
          id="resizerDownload"
          class="resizer-download"
          download
        >
          <i class="fa-solid fa-download"></i>
          Download Image
        </a>

      </div>

    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
     <div class="footer-copy">

            © <span id="year"></span> TOOLBOX.
            Made with
            <i class="fa-solid fa-heart"></i>
            by Gorav.

        </div>

  </footer>

  <!-- Image Resizer JavaScript -->
  <script src="image-resizer.js"></script>

</body>
</html>
