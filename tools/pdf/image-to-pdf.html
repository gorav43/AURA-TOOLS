<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Image to PDF | TOOLBOX</title>

  <link rel="stylesheet" href="image-to-pdf.css" />

  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <header class="top-header">
    <a href="../../index.html" class="logo">TOOL<span>BOX</span></a>

    <a href="../../index.html" class="back-btn">
      ← Back to Tools
    </a>
  </header>

  <main class="container">

    <section class="hero">
      <div class="hero-icon">📄</div>
      <h1>Image to PDF Converter</h1>
      <p>
        Convert your images into a single PDF file quickly and easily.
      </p>
    </section>

    <section class="tool-card">

      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">⬆</div>

        <h2>Upload Images</h2>

        <p>
          Select JPG, JPEG, PNG or WEBP images
        </p>

        <input
          type="file"
          id="imageInput"
          accept="image/*"
          multiple
          hidden
        />

        <button class="primary-btn" id="chooseBtn">
          Choose Images
        </button>

        <p class="small-text">
          You can select multiple images
        </p>
      </div>

      <div class="preview-section" id="previewSection">

        <div class="section-heading">
          <h2>Selected Images</h2>

          <button class="clear-btn" id="clearBtn">
            Clear All
          </button>
        </div>

        <div class="image-preview-grid" id="imagePreviewGrid"></div>

        <div class="settings">

          <div class="setting-box">
            <label for="pageSize">PDF Page Size</label>

            <select id="pageSize">
              <option value="a4">A4</option>
              <option value="letter">Letter</option>
              <option value="a5">A5</option>
            </select>
          </div>

          <div class="setting-box">
            <label for="orientation">Orientation</label>

            <select id="orientation">
              <option value="portrait">Portrait</option>
              <option value="landscape">Landscape</option>
            </select>
          </div>

          <div class="setting-box">
            <label for="margin">Page Margin</label>

            <select id="margin">
              <option value="10">Small</option>
              <option value="20" selected>Medium</option>
              <option value="30">Large</option>
            </select>
          </div>

        </div>

        <button class="download-btn" id="downloadPdfBtn">
          Download PDF
        </button>

      </div>

      <div class="status-message" id="statusMessage"></div>

    </section>

  </main>

  <footer>
    <div class="footer-copy">

            © <span id="year"></span> TOOLBOX.
            Made with
            <i class="fa-solid fa-heart"></i>
            by Gorav.

        </div>

  </footer>

  <script src="image-to-pdf.js"></script>
</body>
</html>
